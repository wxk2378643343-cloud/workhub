services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: smart_office_db
      MYSQL_USER: workhub
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
      - ./sql/smart_office_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u workhub -p\"$$MYSQL_PASSWORD\" smart_office_db -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    environment:
      JDBC_URL: jdbc:mysql://mysql:3306/smart_office_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      JDBC_USERNAME: workhub
      JDBC_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  mysql:
